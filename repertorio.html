<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivalld - Repertório</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/repertorio.css">
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <!-- Header -->
    <header class="header fixed-top">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-2">
                    <button id="backButton" class="btn btn-link nav-btn">
                        <i class="bi bi-arrow-left"></i>
                    </button>
                </div>
                <div class="col-8 text-center d-flex justify-content-center align-items-center">
                    <img style="width: 60%;" src="./assets/img/logo.png" alt="" srcset="">
                </div>
                <div class="col-2 text-end">
                    <button id="menuButton" class="btn btn-link nav-btn">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div id="progressContainer" class="progress-container">
            <div class="progress">
                <div id="wizardProgress" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <span id="progressText" class="progress-text">0/9</span>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
        <!-- Content will be loaded dynamically -->
    </main>

    <!-- Footer -->
    <footer class="footer fixed-bottom">
        <div class="container-fluid">
            <button id="nextButton" class="btn btn-primary next-btn w-100" disabled>
                Próximo
            </button>
        </div>
    </footer>

    <!-- Menu Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group">
                <button class="list-group-item list-group-item-action menu-item" data-action="repertorio">
                    <i class="bi bi-music-note-beamed me-3"></i> Repertório
                </button>
                <!-- <button class="list-group-item list-group-item-action menu-item" data-action="contrato">
                    <i class="bi bi-file-text me-3"></i> Contrato
                </button> -->
                <!-- <button class="list-group-item list-group-item-action menu-item" data-action="boletos">
                    <i class="bi bi-receipt me-3"></i> Boletos
                </button> -->
                <button class="list-group-item list-group-item-action menu-item" data-action="resumo">
                    <i class="bi bi-check2-circle me-3"></i> Repertório Escolhido
                </button>
                <button class="list-group-item list-group-item-action menu-item" data-action="intrucao">
                    <i class="bi bi-check2-circle me-3"></i> Instruções
                </button>
                <button class="list-group-item list-group-item-action menu-item" data-action="orientacao">
                    <i class="bi bi-check2-circle me-3"></i> Orientações
                </button>
                <hr>
                <button class="list-group-item list-group-item-action menu-item text-danger" data-action="logout">
                    <i class="bi bi-box-arrow-right me-3"></i> Sair
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Instruções -->
    <!-- Modal de Instruções -->
    <div class="modal fade" id="instructionsModal" tabindex="-1" aria-labelledby="instructionsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #faf7f2 100%);">
                
                <div class="modal-header border-0 pb-0" style="padding: 1.5rem 1.5rem 0.5rem 1.5rem;">
                    <div class="w-100 text-center">
                        <div style="
                            width: 72px;
                            height: 72px;
                            margin: 0 auto 14px auto;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            background: linear-gradient(135deg, #d4af37, #f3e5ab);
                            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
                        ">
                            <i class="bi bi-music-note-beamed" style="font-size: 1.8rem; color: #fff;"></i>
                        </div>

                        <h5 id="instructionsModalLabel" class="modal-title fw-semibold" style="
                            font-family: 'Cormorant Garamond', serif;
                            font-size: 2rem;
                            color: #3a2f2a;
                            letter-spacing: 0.3px;
                        ">
                            Como usar
                        </h5>

                        <p class="mb-0" style="
                            font-size: 0.95rem;
                            color: #8b7d74;
                            font-family: 'Montserrat', sans-serif;
                        ">
                            Selecione e ouça suas músicas com facilidade
                        </p>
                    </div>
                </div>

                <div class="modal-body pt-3" style="padding: 1.25rem 1.5rem 1rem 1.5rem;">
                    <div class="mb-3 p-3" style="
                        background: rgba(255,255,255,0.85);
                        border: 1px solid rgba(212, 175, 55, 0.18);
                        border-radius: 18px;
                        box-shadow: 0 6px 18px rgba(0,0,0,0.04);
                    ">
                        <div class="d-flex align-items-start gap-3">
                            <div style="
                                min-width: 42px;
                                height: 42px;
                                border-radius: 12px;
                                background: linear-gradient(135deg, #f7d774, #e7bb45);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                box-shadow: 0 6px 14px rgba(231, 187, 69, 0.25);
                            ">
                                <i class="bi bi-check2-circle" style="color: white; font-size: 1.1rem;"></i>
                            </div>
                            <div>
                                <div style="
                                    font-weight: 600;
                                    color: #4a3d36;
                                    font-family: 'Montserrat', sans-serif;
                                    margin-bottom: 4px;
                                ">
                                    Selecionar música
                                </div>
                                <div style="
                                    color: #7b6e65;
                                    font-size: 0.93rem;
                                    line-height: 1.5;
                                ">
                                    Clique sobre o cartão da música para marcá-la como selecionada.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-3" style="
                        background: rgba(255,255,255,0.85);
                        border: 1px solid rgba(212, 175, 55, 0.18);
                        border-radius: 18px;
                        box-shadow: 0 6px 18px rgba(0,0,0,0.04);
                    ">
                        <div class="d-flex align-items-start gap-3">
                            <div style="
                                min-width: 42px;
                                height: 42px;
                                border-radius: 12px;
                                background: linear-gradient(135deg, #c89b3c, #a67c2e);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                box-shadow: 0 6px 14px rgba(166, 124, 46, 0.25);
                            ">
                                <i class="bi bi-play-fill" style="color: white; font-size: 1.2rem;"></i>
                            </div>
                            <div>
                                <div style="
                                    font-weight: 600;
                                    color: #4a3d36;
                                    font-family: 'Montserrat', sans-serif;
                                    margin-bottom: 4px;
                                ">
                                    Reproduzir música
                                </div>
                                <div style="
                                    color: #7b6e65;
                                    font-size: 0.93rem;
                                    line-height: 1.5;
                                ">
                                    Use o botão de play para ouvir a prévia da música antes de escolher.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 pt-0" style="padding: 0 1.5rem 1.5rem 1.5rem;">
                    <button type="button" class="btn w-100" data-bs-dismiss="modal" style="
                        border: none;
                        border-radius: 14px;
                        padding: 0.9rem 1rem;
                        font-weight: 600;
                        font-size: 0.95rem;
                        letter-spacing: 0.3px;
                        color: #fff;
                        background: linear-gradient(135deg, #b88a2d, #d4af37);
                        box-shadow: 0 10px 20px rgba(184, 138, 45, 0.28);
                        transition: all 0.3s ease;
                    " onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 14px 28px rgba(184, 138, 45, 0.32)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 20px rgba(184, 138, 45, 0.28)'">
                        Entendi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="./assets/js/musicas.js"></script> -->
    <script src="./assets/js/db.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/repertorio.js"></script>
    <script src="./assets/js/utils.js"></script>
    <script>
        let menuOffcanvas;
        let currentSectionIndex = 0;
        function getSections() {
            return Array.isArray(Repertorio.sections)
                ? Repertorio.sections.map(s => s.name)
                : [];
        }



        $(document).ready(async () => {
            // await DB.init();
            await Auth.init();
            await Repertorio.init();
            
            // Verificar autenticação
            if (!Auth.currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // Verificar termos
            const terms = await Auth.checkFirstTimeUser();
            if (!terms.termo1Aceito || !terms.termo2Aceito) {
                window.location.href = 'termo1.html';
                return;
            }

            // Setup menu
            menuOffcanvas = new bootstrap.Offcanvas(document.getElementById('menuOffcanvas'));
            
            // Carregar seção atual
            currentSectionIndex = Repertorio.currentSectionIndex;
            $('#loadingOverlay').removeClass('d-none');
            await loadCurrentSection();

            // Event Listeners
            $('#menuButton').on('click', () => menuOffcanvas.show());
            
            $('#backButton').on('click', async () => {
                if (currentSectionIndex > 0) {
                    currentSectionIndex--;
                    Repertorio.currentSectionIndex = currentSectionIndex;
                    await Repertorio.saveProgressLocalAndQueue();
                    $('#loadingOverlay').removeClass('d-none');
                    await loadCurrentSection();
                } else {
                    window.location.href = 'termo2.html';
                }
            });

            $('#nextButton').on('click', async () => {
                if (currentSectionIndex < getSections().length - 1) {
                    currentSectionIndex++;
                    Repertorio.currentSectionIndex = currentSectionIndex;
                    await Repertorio.saveProgressLocalAndQueue();
                    $('#loadingOverlay').removeClass('d-none');
                    await loadCurrentSection();
                } else {
                    await Repertorio.forceFullSync();
                    window.location.href = 'resumo.html';
                }
            });

            // Menu items
            $('.menu-item').on('click', async (e) => {
                const action = $(e.currentTarget).data('action');
                menuOffcanvas.hide();
                
                if (action === 'logout') {
                    await Auth.logout();
                    window.location.href = 'login.html';
                } else {
                    window.location.href = `${action}.html`;
                }
            });
        });

        async function loadCurrentSection() {
            $('#loadingOverlay').removeClass('d-none');

            const sections = getSections();

            if (!sections.length) {
                $('#mainContent').html('<div class="alert alert-warning">Nenhuma seção encontrada.</div>');
                $('#wizardProgress').css('width', '0%');
                $('#progressText').text('0/0');
                $('#nextButton').prop('disabled', true);
                $('#loadingOverlay').addClass('d-none');
                return;
            }

            if (currentSectionIndex >= sections.length) {
                currentSectionIndex = 0;
                Repertorio.currentSectionIndex = 0;
            }

            const sectionName = sections[currentSectionIndex];
            const html = await Repertorio.renderSection(sectionName);
            $('#mainContent').html(html);

            updateProgress();
            Repertorio.updateNextButton();

            $('#loadingOverlay').addClass('d-none');
        }

        function updateProgress() {
            const total = getSections().length;

            if (!total) {
                $('#wizardProgress').css('width', '0%');
                $('#progressText').text('0/0');
                return;
            }

            const progress = ((currentSectionIndex + 1) / total) * 100;
            $('#wizardProgress').css('width', `${progress}%`);
            $('#progressText').text(`${currentSectionIndex + 1}/${total}`);
        }
    </script>
</body>
</html>
