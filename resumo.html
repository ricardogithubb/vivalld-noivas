<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivalld - Meu Repertório</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/resumo.css">
</head>
<body>
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <header class="header fixed-top">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-2">
                    <button id="backButton" class="btn btn-link nav-btn">
                        <i class="bi bi-arrow-left"></i>
                    </button>
                </div>
                <div class="col-8 text-center d-flex justify-content-center align-items-center">
                    <img style="width: 60%;" src="./assets/img/logo.png" alt="">
                </div>
                <div class="col-2 text-end">
                    <button id="menuButton" class="btn btn-link nav-btn">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="mainContent" class="main-content"></main>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group">
                <button class="list-group-item list-group-item-action menu-item" data-action="repertorio">
                    <i class="bi bi-music-note-beamed me-3"></i> Repertório
                </button>
                <button class="list-group-item list-group-item-action menu-item active" data-action="resumo">
                    <i class="bi bi-check2-circle me-3"></i> Repertório Escolhido
                </button>
                <hr>
                <button class="list-group-item list-group-item-action menu-item text-danger" data-action="logout">
                    <i class="bi bi-box-arrow-right me-3"></i> Sair
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Ação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmMessage">Tem certeza que deseja realizar esta ação?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="confirmAction">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="shareModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Arquivo pronto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2">Seu Word foi gerado.</p>
                    <p class="small text-muted mb-0">Toque em “Compartilhar” para enviar no WhatsApp.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="downloadWordBtn">
                        Baixar
                    </button>
                    <button type="button" class="btn btn-primary" id="shareWordNowBtn">
                        Compartilhar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script src="./assets/js/db.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/repertorio.js"></script>
    <script src="./assets/js/utils.js"></script>

    <script>
        let menuOffcanvas;
        let confirmModal;
        let shareModal;
        let currentAction = null;
        let cachedWord = { file: null, blob: null, fileName: null };
        let songsMap = {};

        const sections = [
            'Entrada do Noivo',
            'Entrada das Damas',
            'Entrada da Noiva',
            'Salmo',
            'Aclamação',
            'Comunhão',
            'Assinatura',
            'Fotos',
            'Saída do Casal'
        ];

        $(document).ready(async () => {
            try {
                $('#loadingOverlay').removeClass('d-none');

                await Auth.init();
                await Repertorio.init();

                if (!Auth.currentUser) {
                    window.location.href = 'login.html';
                    return;
                }

                const terms = await Auth.checkFirstTimeUser();
                if (!terms.termo1Aceito || !terms.termo2Aceito) {
                    window.location.href = 'termo1.html';
                    return;
                }

                menuOffcanvas = new bootstrap.Offcanvas(document.getElementById('menuOffcanvas'));
                confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
                shareModal = new bootstrap.Modal(document.getElementById('shareModal'));

                await loadSongsMap();
                await loadResumo();
                setupEventListeners();

            } catch (error) {
                console.error('Erro ao inicializar resumo:', error);
                Utils.showToast('Erro ao carregar página', 'danger');
            } finally {
                $('#loadingOverlay').addClass('d-none');
            }
        });

        function setupEventListeners() {
            $('#menuButton').on('click', () => menuOffcanvas.show());

            $('.menu-item').on('click', async (e) => {
                const action = $(e.currentTarget).data('action');
                menuOffcanvas.hide();

                if (action === 'logout') {
                    await handleLogout();
                } else {
                    window.location.href = action + '.html';
                }
            });

            $('#backButton').on('click', () => {
                window.location.href = 'repertorio.html';
            });

            $('#confirmAction').on('click', async () => {
                if (currentAction === 'clear') {
                    await clearRepertory();
                } else if (currentAction === 'edit') {
                    window.location.href = 'repertorio.html';
                }
                confirmModal.hide();
            });

            $('#downloadWordBtn').on('click', () => {
                if (!cachedWord.blob) return;

                const url = URL.createObjectURL(cachedWord.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = cachedWord.fileName || 'repertorio.docx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            });

            $('#shareWordNowBtn').on('click', async () => {
                try {
                    if (!cachedWord.file) return;

                    const canShareFiles = !!(
                        navigator.share &&
                        navigator.canShare &&
                        navigator.canShare({ files: [cachedWord.file] })
                    );

                    if (!canShareFiles) {
                        Utils.showToast('Seu navegador não permite compartilhar arquivo. Use "Baixar".', 'warning');
                        return;
                    }

                    await navigator.share({
                        title: 'Meu Repertório - Vivalld',
                        text: 'Segue o resumo do meu repertório em Word.',
                        files: [cachedWord.file]
                    });

                    shareModal.hide();
                    Utils.showToast('Compartilhamento iniciado!');
                } catch (error) {
                    console.error('Erro ao compartilhar Word:', error);
                    if (error && error.name === 'AbortError') return;
                    Utils.showToast('Não foi possível compartilhar. Use "Baixar".', 'warning');
                }
            });
        }

        async function loadSongsMap() {
            try {
                const response = await fetch(API_BASE + '/songs', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + Auth.token,
                        'Accept': 'application/json'
                    }
                });

                const result = await response.json();

                if (!result.success || !Array.isArray(result.data)) {
                    throw new Error(result.message || 'Erro ao carregar músicas');
                }

                songsMap = {};
                result.data.forEach(song => {
                    if (song.song_id) songsMap[song.song_id] = song;
                    if (song.id) songsMap[song.id] = song;
                });
            } catch (error) {
                console.error('Erro ao carregar mapa de músicas:', error);
                songsMap = {};
            }
        }

        async function loadResumo() {
            const selections = Repertorio.selections || {};
            let hasSelections = false;

            let html = `
                <div class="section-card fade-in">
                    <div class="resumo-header">
                        <div>
                            <h2 class="resumo-title">Meu Repertório</h2>
                            <p class="resumo-subtitle">Músicas selecionadas para o seu grande dia</p>
                        </div>
                        <div class="resumo-badge">
                            <span class="badge-count">${getTotalSelectedSongs()}</span>
                            <span class="badge-label">músicas</span>
                        </div>
                    </div>
            `;

            for (const section of sections) {
                if (selections[section] && selections[section].length > 0) {
                    hasSelections = true;
                    break;
                }
            }

            if (!hasSelections) {
                html += `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="bi bi-music-note-beamed"></i>
                        </div>
                        <h3 class="empty-state-title">Nenhuma música selecionada</h3>
                        <p class="empty-state-text">Você ainda não escolheu as músicas para o seu repertório.</p>
                        <button class="btn btn-primary btn-elegant mt-3" onclick="window.location.href='repertorio.html'">
                            <i class="bi bi-plus-circle me-2"></i>Começar a Selecionar
                        </button>
                    </div>
                `;
            } else {
                for (const section of sections) {
                    const sectionSelections = selections[section] || [];

                    if (sectionSelections.length > 0) {
                        html += `
                            <div class="resumo-section">
                                <div class="resumo-section-header">
                                    <h3 class="resumo-section-title">${section}</h3>
                                    <span class="resumo-section-badge">
                                        <i class="bi bi-music-note me-1"></i>${sectionSelections.length}/2
                                    </span>
                                </div>
                                <div class="resumo-songs">
                        `;

                        for (const songId of sectionSelections) {
                            const song = songsMap[songId];

                            if (song) {
                                html += `
                                    <div class="resumo-song-card">
                                        <div class="resumo-song-info">
                                            <i class="bi bi-file-music-fill resumo-song-icon"></i>
                                            <div class="resumo-song-details">
                                                <h4 class="resumo-song-title">${escapeHtml(song.title || '')}</h4>
                                                <p class="resumo-song-artist">${escapeHtml(song.artist || '')}</p>
                                            </div>
                                        </div>
                                        <button class="btn-remove-song" 
                                                data-song-id="${songId}"
                                                data-section="${escapeHtml(section)}"
                                                title="Remover música">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </div>
                                `;
                            } else {
                                html += `
                                    <div class="resumo-song-card">
                                        <div class="resumo-song-info">
                                            <i class="bi bi-file-music-fill resumo-song-icon"></i>
                                            <div class="resumo-song-details">
                                                <h4 class="resumo-song-title">${escapeHtml(songId)}</h4>
                                                <p class="resumo-song-artist">Música não localizada</p>
                                            </div>
                                        </div>
                                        <button class="btn-remove-song"
                                                data-song-id="${songId}"
                                                data-section="${escapeHtml(section)}"
                                                title="Remover música">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </div>
                                `;
                            }
                        }

                        html += `
                                </div>
                            </div>
                        `;
                    }
                }

                html += `
                    <div class="resumo-actions">
                        <button class="btn-action btn-action-edit" id="editRepertoryBtn">
                            <i class="bi bi-pencil me-2"></i>Editar
                        </button>
                        <button class="btn-action btn-action-clear" id="clearRepertoryBtn">
                            <i class="bi bi-trash me-2"></i>Limpar
                        </button>
                        <button class="btn-action btn-action-export" id="exportWordBtn">
                            <i class="bi bi-file-earmark-word me-2"></i>Exportar
                        </button>
                    </div>
                `;
            }

            html += `</div>`;

            $('#mainContent').html(html);

            $('.btn-remove-song').on('click', async (e) => {
                e.stopPropagation();
                const songId = $(e.currentTarget).data('song-id');
                const section = $(e.currentTarget).data('section');
                await removeSong(songId, section);
            });

            $('#editRepertoryBtn').on('click', () => {
                currentAction = 'edit';
                $('#confirmMessage').text('Deseja editar seu repertório? Você voltará para o wizard de seleção.');
                confirmModal.show();
            });

            $('#clearRepertoryBtn').on('click', () => {
                currentAction = 'clear';
                $('#confirmMessage').text('Tem certeza que deseja limpar todo o repertório? Esta ação não pode ser desfeita.');
                confirmModal.show();
            });

            $('#exportWordBtn').on('click', exportResumoToWord);
        }

        async function removeSong(songId, section) {
            try {
                $('#loadingOverlay').removeClass('d-none');

                const response = await fetch(API_BASE + '/selections', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + Auth.token,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ songId: songId })
                });

                

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Erro ao remover música');
                }

                if (Repertorio.selections[section]) {
                    const index = Repertorio.selections[section].indexOf(songId);
                    if (index > -1) {
                        Repertorio.selections[section].splice(index, 1);
                    }

                    if (Repertorio.selections[section].length === 0) {
                        delete Repertorio.selections[section];
                    }
                }

                await loadResumo();
                Utils.showToast('Música removida com sucesso');
            } catch (error) {
                console.error('Erro ao remover música:', error);
                Utils.showToast(error.message || 'Erro ao remover música', 'danger');
            } finally {
                $('#loadingOverlay').addClass('d-none');
            }
        }

        async function clearRepertory() {
            try {
                $('#loadingOverlay').removeClass('d-none');

                const response = await fetch(API_BASE + '/selections', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + Auth.token,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ clearAll: true })
                });
                

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Erro ao limpar repertório');
                }

                await Repertorio.deleteProgress();

                Repertorio.selections = {};
                await loadResumo();
                Utils.showToast('Repertório limpo com sucesso');
            } catch (error) {
                console.error('Erro ao limpar repertório:', error);
                Utils.showToast(error.message || 'Erro ao limpar repertório', 'danger');
            } finally {
                $('#loadingOverlay').addClass('d-none');
            }
        }

        async function handleLogout() {
            await Auth.logout();
            window.location.href = 'login.html';
        }

        function getTotalSelectedSongs() {
            let total = 0;
            for (const section of sections) {
                if (Repertorio.selections[section]) {
                    total += Repertorio.selections[section].length;
                }
            }
            return total;
        }

        async function exportResumoToWord() {
            try {
                $('#loadingOverlay').removeClass('d-none');

                const selections = Repertorio.selections || {};
                const hasSelections = sections.some(s => selections[s] && selections[s].length > 0);

                if (!hasSelections) {
                    Utils.showToast('Você ainda não selecionou músicas para exportar.', 'warning');
                    return;
                }

                const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = window.docx;
                const children = [];

                children.push(
                    new Paragraph({
                        heading: HeadingLevel.TITLE,
                        alignment: AlignmentType.CENTER,
                        children: [new TextRun({ text: 'Vivalld - Meu Repertório', bold: true })]
                    })
                );

                const now = new Date();
                children.push(
                    new Paragraph({
                        alignment: AlignmentType.CENTER,
                        children: [new TextRun({ text: 'Gerado em: ' + now.toLocaleString('pt-BR'), italics: true })]
                    })
                );

                children.push(new Paragraph({ text: '' }));
                children.push(
                    new Paragraph({
                        children: [new TextRun({ text: 'Total de músicas selecionadas: ' + getTotalSelectedSongs(), bold: true })]
                    })
                );
                children.push(new Paragraph({ text: '' }));

                for (const section of sections) {
                    const ids = selections[section] || [];
                    if (!ids.length) continue;

                    children.push(
                        new Paragraph({
                            heading: HeadingLevel.HEADING_2,
                            children: [new TextRun({ text: section + ' (' + ids.length + '/2)', bold: true })]
                        })
                    );

                    for (const songId of ids) {
                        const song = songsMap[songId];
                        const title = song && song.title ? song.title.trim() : songId;
                        const artist = song && song.artist ? song.artist.trim() : '';

                        children.push(
                            new Paragraph({
                                children: [
                                    new TextRun({ text: '• ', bold: true }),
                                    new TextRun({ text: title, bold: true }),
                                    new TextRun({ text: artist ? ' — ' + artist : '' })
                                ]
                            })
                        );
                    }

                    children.push(new Paragraph({ text: '' }));
                }

                const doc = new Document({ sections: [{ properties: {}, children: children }] });
                const blob = await Packer.toBlob(doc);
                const fileName = 'Vivalld-Repertorio-' + now.toISOString().slice(0, 10) + '.docx';
                const file = new File([blob], fileName, {
                    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                });

                cachedWord = { file: file, blob: blob, fileName: fileName };
                shareModal.show();
                Utils.showToast('Word gerado com sucesso!');
            } catch (error) {
                console.error('Erro ao gerar Word:', error);
                Utils.showToast('Erro ao gerar Word do repertório', 'danger');
            } finally {
                $('#loadingOverlay').addClass('d-none');
            }
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #c9a45b, #e8c98b);
            --secondary-color: #4a3b2a;
            --text-dark: #2c2c2c;
            --text-light: #6b6b6b;
            --border-light: #f0e9e0;
            --bg-soft: #fff9f5;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 24px rgba(201, 164, 91, 0.15);
        }

        .resumo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 1.5rem 1.5rem 0;
        }

        .resumo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .resumo-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--text-light);
            margin: 0.25rem 0 0;
            font-weight: 300;
        }

        .resumo-badge {
            background: var(--primary-gradient);
            padding: 0.75rem 1.5rem;
            border-radius: 60px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .badge-count {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary-color);
            line-height: 1;
        }

        .badge-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary-color);
            opacity: 0.8;
        }

        .resumo-section {
            background: white;
            border-radius: 24px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .resumo-section:hover {
            box-shadow: var(--shadow-hover);
            border-color: #c9a45b;
            transform: translateY(-2px);
        }

        .resumo-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-light);
        }

        .resumo-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin: 0;
        }

        .resumo-section-badge {
            background: var(--bg-soft);
            padding: 0.35rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: var(--secondary-color);
            border: 1px solid var(--border-light);
        }

        .resumo-songs {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .resumo-song-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-soft);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .resumo-song-card:hover {
            background: white;
            border-color: #c9a45b;
            transform: translateX(8px);
        }

        .resumo-song-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .resumo-song-icon {
            font-size: 1.5rem;
            color: #c9a45b;
            opacity: 0.6;
        }

        .resumo-song-details {
            flex: 1;
        }

        .resumo-song-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin: 0 0 0.25rem;
        }

        .resumo-song-artist {
            font-size: 0.85rem;
            color: var(--text-light);
            margin: 0;
            font-style: italic;
        }

        .btn-remove-song {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-light);
            background: white;
            color: #dc3545;
